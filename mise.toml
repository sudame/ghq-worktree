[settings]
# Go の版は go.mod の toolchain の行だけに書く
idiomatic_version_file_enable_tools = ["go"]

[tools]
golangci-lint = "2.15.0"
goreleaser = "2.20.0"
jactionlint = "2.5.0"
# jactionlint が run の中身を検査するのに使う
shellcheck = "0.11.0"

[tasks.test]
description = "テストを走らせる"
run = [
  "go test ./...",
  "bash scripts/release_test.sh",
]

[tasks.lint]
description = "golangci-lint をデフォルト設定で走らせ、ワークフローとスクリプトを検査する"
run = [
  "golangci-lint run ./...",
  "jactionlint",
  "shellcheck scripts/*.sh",
]

[tasks.build]
description = "バイナリを作る"
run = "go build -o ghq-worktree ."

[tasks.release-check]
description = "リリースの設定を確かめ、タグなしで試しにビルドする"
run = [
  "goreleaser check",
  "goreleaser release --snapshot --clean",
]

[tasks.release-bump]
description = "標準入力の PR のラベルから、上げる桁を決める"
run = "bash scripts/release-bump.sh"

[tasks.next-version]
description = "次のリリースのタグを出す（引数は patch、minor、major、skip）"
run = "bash scripts/next-version.sh"
