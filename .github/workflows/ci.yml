name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
      # キャッシュが古くても Go が使えない分を作り直すだけなので、保存し直すのはツールのバージョンが変わったときだけにする。
      # 毎回保存すると、ジョブの最後にアップロードの時間がかかる。
      # キーが外れたら前のキャッシュから戻し、新しいキーで保存する
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ hashFiles('mise.toml', 'go.mod') }}
          restore-keys: go-build-${{ github.job }}-
      - run: mise run test

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go golangci-lint jactionlint shellcheck
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-build-${{ github.job }}-${{ hashFiles('mise.toml', 'go.mod') }}
          restore-keys: go-build-${{ github.job }}-
      - run: mise run lint

  release-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go goreleaser
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-goreleaser-${{ hashFiles('mise.toml', 'go.mod') }}
          restore-keys: go-build-goreleaser-
      - run: mise run release-check
